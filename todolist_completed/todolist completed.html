 <meta charset="utf-8">

</body>

    <div id = "title">ToDo List</div>

<div class="input-area">
  <input id="newTask" type="text" placeholder="Enter a new task"></input>
  <button id="addButton" onclick="AddPressed()">Add task</button>
</div>

<table id="result"></table>

<script>
  let tasks =[];
function AddPressed() {
  const newTask = document.getElementById('newTask');
  //no tasks
  if (newTask.value === '') {
    return;
  }
  //add task
  tasks.push(newTask.value);
  //clear input
  newTask.value = '';
  //redraw
  draw();

}

function draw() {
  let result = '';



  for (let i = 0; i < tasks.length; i++) {
    result += "<tr>\n" + 
              `<td id="taskElement">${tasks[i]}</td>\n` + 
              `<td><button onclick="deleteTask(${i})">Delete</button></td>\n` + 
              "</tr>";
  }
  
  document.getElementById('result').innerHTML = result;}

function deleteTask(index) {
  tasks.splice(index, 1);
  draw();
}


</script>



</body>

</html>
